version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kisan_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - kisan_uploads:/app/uploads
      - kisan_db:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./data/kisan_alert.db
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kisan_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always

volumes:
  kisan_uploads:
  kisan_db:
